name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io

jobs:

  # ──────────────────────────────────────────
  # 1. BUILD  (compile + package, no tests)
  # ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven build (skip tests)
        run: mvn clean package -DskipTests --batch-mode

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: '*/target/*.jar'
          retention-days: 1

  # ──────────────────────────────────────────
  # 2. TEST + COVERAGE GATE
  #    mvn verify runs: tests → JaCoCo report
  #    → check (fails build if < 80%)
  # ──────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with coverage check
        # verify phase = test + JaCoCo report + JaCoCo check (80% minimum)
        # Build FAILS here if any module is below 80% instruction coverage
        run: mvn verify --batch-mode
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/*.xml'
          retention-days: 7

      - name: Publish JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '*/target/site/jacoco/'
          retention-days: 7

  # ──────────────────────────────────────────
  # 3. SONARQUBE  (runs after tests so it has
  #    coverage data; waits for Quality Gate)
  # ──────────────────────────────────────────
  quality:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for blame / SCM info

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Restore JaCoCo reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: jacoco-reports

      - name: Rebuild sources for Sonar bytecode analysis
        # sonar-maven-plugin needs compiled classes; skip tests since we already ran them
        run: mvn compile test-compile -DskipTests --batch-mode

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=garage-microservices \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=\
              auth-service/target/site/jacoco/jacoco.xml,\
              vehicle-service/target/site/jacoco/jacoco.xml,\
              stock-service/target/site/jacoco/jacoco.xml,\
              invoice-service/target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            --batch-mode
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Skip Sonar (token not configured)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN secret not set — Sonar scan skipped."
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────
  # 4. DOCKER BUILD & PUSH
  # ──────────────────────────────────────────
  docker-build:
    name: Docker – ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'
    env:
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            image: auth
          - service: vehicle-service
            image: vehicle
          - service: stock-service
            image: stock
          - service: invoice-service
            image: invoice
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        if: env.DOCKER_USER != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKER_USER }}/garage-microservices-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ env.DOCKER_USER != '' }}
          tags: ${{ env.DOCKER_USER != '' && steps.meta.outputs.tags || matrix.service }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # 5. DEPLOY TO DEV  (push to main)
  # ──────────────────────────────────────────
  deploy-dev:
    name: Deploy – Dev
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::notice::KUBE_CONFIG secret not set — skipping deployment."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
          else
            mkdir -p ~/.kube
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
          fi

      - name: Deploy to dev
        if: env.SKIP_DEPLOY != 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: bash scripts/deploy-k8s.sh dev latest

  # ──────────────────────────────────────────
  # 6. DEPLOY TO PROD  (version tag v*)
  # ──────────────────────────────────────────
  deploy-prod:
    name: Deploy – Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::notice::KUBE_CONFIG secret not set — skipping deployment."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
          else
            mkdir -p ~/.kube
            echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config
          fi

      - name: Deploy to production
        if: env.SKIP_DEPLOY != 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: bash scripts/deploy-k8s.sh prod "${GITHUB_REF#refs/tags/v}"
