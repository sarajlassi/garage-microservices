global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'garage-microservices'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # add alertmanager:9093 when deployed

rule_files: []          # add alert rule files here when needed

scrape_configs:
  # ─────────────────────────────────────────
  # Prometheus self-monitoring
  # ─────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ─────────────────────────────────────────
  # Auth Service — Spring Boot Actuator
  # ─────────────────────────────────────────
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: auth-service

  # ─────────────────────────────────────────
  # Vehicle Service — Spring Boot Actuator
  # ─────────────────────────────────────────
  - job_name: vehicle-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['vehicle-service:8082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: vehicle-service

  # ─────────────────────────────────────────
  # Stock Service — Spring Boot Actuator
  # ─────────────────────────────────────────
  - job_name: stock-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['stock-service:8083']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: stock-service

  # ─────────────────────────────────────────
  # Invoice Service — Spring Boot Actuator
  # ─────────────────────────────────────────
  - job_name: invoice-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['invoice-service:8084']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: invoice-service

  # ─────────────────────────────────────────
  # PostgreSQL Exporter
  # ─────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ─────────────────────────────────────────
  # Kafka Exporter (consumer-group lag, topic metrics)
  # ─────────────────────────────────────────
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  # ─────────────────────────────────────────
  # Node Exporter (host OS metrics)
  # ─────────────────────────────────────────
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # ─────────────────────────────────────────
  # cAdvisor (Docker container metrics)
  # ─────────────────────────────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # ─────────────────────────────────────────
  # Loki (log ingestion metrics)
  # ─────────────────────────────────────────
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics
