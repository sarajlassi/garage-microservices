version: '3.9'

services:
  # =======================================
  # Jenkins
  # =======================================
  jenkins:
    image: jenkins/jenkins:lts-alpine
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_OPTS: ""
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/jenkins-casc.yaml:/var/jenkins_home/casc.yaml:ro
    networks:
      - garage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =======================================
  # SonarQube
  # =======================================
  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
    depends_on:
      - postgres-sonar
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # SonarQube Database
  # =======================================
  postgres-sonar:
    image: postgres:17-alpine
    container_name: postgres-sonar
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - postgres-sonar-data:/var/lib/postgresql/data
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # Nexus (Artifact Repository)
  # =======================================
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    ports:
      - "8081:8081"
    environment:
      NEXUS_CONTEXT: "/"
    volumes:
      - nexus-data:/nexus-data
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # GitLab (Optional)
  # =======================================
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    ports:
      - "8000:80"
      - "8443:443"
      - "2222:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8000'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    networks:
      - garage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/help"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =======================================
  # Portainer (Docker Management)
  # =======================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9001:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # Docker Registry
  # =======================================
  registry:
    image: registry:2
    container_name: registry
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # Registry UI
  # =======================================
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    ports:
      - "5001:80"
    environment:
      REGISTRY_TITLE: "Private Registry"
      REGISTRY_URL: http://registry:5000
    depends_on:
      - registry
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # Prometheus (Metrics collection)
  # =======================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ${PWD}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # Loki (Log aggregation)
  # =======================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ${PWD}/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - garage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =======================================
  # Promtail (Log shipper — reads Docker container logs)
  # =======================================
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ${PWD}/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # Node Exporter (Host OS metrics)
  # =======================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # cAdvisor (Docker container resource metrics)
  # =======================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # Kafka Exporter (Kafka consumer-group lag metrics)
  # =======================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:29092'
    networks:
      - garage-network
    restart: unless-stopped

  # =======================================
  # Grafana (Visualization — metrics + logs)
  # =======================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "lokiExploreLogsDefaultRange"
      GF_LOG_LEVEL: warn
    volumes:
      - grafana-data:/var/lib/grafana
      - ${PWD}/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ${PWD}/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - garage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  jenkins-data:
  sonarqube-data:
  sonarqube-extensions:
  postgres-sonar-data:
  nexus-data:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  portainer-data:
  registry-data:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  garage-network:
    driver: bridge
