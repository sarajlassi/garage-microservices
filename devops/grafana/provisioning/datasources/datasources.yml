apiVersion: 1

datasources:
  # ─────────────────────────────────────────
  # Prometheus — metrics
  # ─────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # ─────────────────────────────────────────
  # Loki — logs
  # ─────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 5000
      derivedFields:
        - name: TraceID
          matcherRegex: "traceId=(\\w+)"
          url: ""
          datasourceUid: ""
