sonar.projectKey=garage-microservices
sonar.projectName=Garage Microservices
sonar.projectVersion=1.0.0

# ─── Coverage ────────────────────────────────────────────────
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=\
  auth-service/target/site/jacoco/jacoco.xml,\
  vehicle-service/target/site/jacoco/jacoco.xml,\
  stock-service/target/site/jacoco/jacoco.xml,\
  invoice-service/target/site/jacoco/jacoco.xml

# ─── Source layout ───────────────────────────────────────────
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# ─── Exclusions (boilerplate / generated / config) ───────────
# These classes are excluded from coverage metrics because they
# are either auto-generated, wiring-only, or trivial DTOs.
sonar.exclusions=\
  **/model/**,\
  **/dto/**,\
  **/entity/**,\
  **/config/**,\
  **/exception/**,\
  **/kafka/KafkaEvents.java,\
  **/*Application.java

sonar.coverage.exclusions=\
  **/model/**,\
  **/dto/**,\
  **/entity/**,\
  **/config/**,\
  **/exception/**,\
  **/kafka/KafkaEvents.java,\
  **/*Application.java

# ─── Encoding ────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
